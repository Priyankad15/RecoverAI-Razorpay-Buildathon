# Render Blueprint for the RecoverAI backend.
# Deploy: connect this repo in the Render dashboard and it will read
# this file automatically ("New +" -> "Blueprint"), or use the Render
# CLI. Not deployed from this development environment (no network
# access to Render here) - this file was written and is ready to use,
# but the actual deployment has not been performed or verified live.
services:
  - type: web
    name: recoverai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recoverai-db
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        sync: false  # set to your deployed Vercel URL after the frontend is deployed
      - key: LLM_PROVIDER
        value: mock
      - key: RECOVERY_EXECUTOR
        value: simulation
      - key: RAZORPAY_MODE
        value: test
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: recoverai-db
    plan: free
